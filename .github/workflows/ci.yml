name: Model and evidence checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m examples.validate_bundle
      - run: python -m tools.audit_presentation
      - run: python -m unittest SciML.tests.test_learning_coordinate_operator SciML.tests.test_learning_ensemble SciML.tests.test_learning_pinn_inverse SciML.tests.test_learning_pool_loop SciML.tests.test_learning_design_loop SciML.tests.test_learning_exercises SciML.tests.test_acquisition_diversity SciML.tests.test_multistep_historical -v
      - run: python -m examples.multicycle_multistep --verify-only
      - run: python -m unittest SciML.tests.test_hierarchical_operator -v
      - run: python -m examples.verify_hierarchical
      - run: python -m unittest SciML.tests.test_formal_hierarchical -v
      - run: python -m examples.formal_hierarchical --verify-only
      - run: python -m unittest SciML.tests.test_modal_operator -v
      - run: python -m examples.verify_modal_evidence
      - run: python -m unittest SciML.tests.test_selective_sma SciML.tests.test_thermal_readout -v
      - run: python -m examples.verify_thermal_readout
      - run: python -m unittest SciML.tests.test_stage_thermal_readout -v
      - run: python -m examples.verify_stage_readout
      - run: python -m unittest SciML.tests.test_mean_thermal_readout SciML.tests.test_thermal_geometry -v
      - run: python -m examples.verify_mean_development
      - run: python -m examples.verify_increment_consistency
      - run: python -m unittest SciML.tests.test_relaxation_readout -v
      - run: python -m examples.verify_relaxation_readout
      - run: python -m unittest SciML.tests.test_risk_limited_readout -v
      - run: python -m examples.verify_risk_limited_readout
      - run: python -m unittest SciML.tests.test_loading_phase_weighted -v
      - run: python -m examples.loading_phase_weighted_study --verify evidence/local_studies/loading_phase_weighted_20261121
      - run: python -m unittest SciML.tests.test_loading_phase_central -v
      - run: python -m examples.loading_phase_central_study --verify evidence/local_studies/loading_phase_central_20261121
      - run: python -m examples.modal_showcase --output demo-output-ci-modal --no-animation
      - run: node examples/test_field_explorer.cjs
      - run: node examples/test_field_explorer.cjs assets/showcase/explorer.html
      - run: python -m examples.showcase --output demo-output-ci --no-animation
      - run: python -m examples.research_gallery --output demo-output-ci-research
      - run: python -m examples.multicycle_gallery --output demo-output-ci-multicycle
      - run: python -m examples.operator_showcase --output demo-output-ci-operator --no-animation
      - run: python -m examples.field_showcase --output demo-output-ci-fields --no-animation
